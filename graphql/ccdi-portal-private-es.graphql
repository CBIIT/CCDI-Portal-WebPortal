# Hub globalSearch GraphQL contract (reference).
# About tab search is frontend-only (Fuse.js) — about_count / about_page are not queried.

type GlobalSearchResult {
    participant_count: Int
    study_count: Int
    sample_count: Int
    file_count: Int
    model_count: Int
}

schema {
    query: QueryType
}

type QueryType {
    esVersion: String
    globalSearch (input: String, first: Int = 10, offset: Int = 0): GlobalSearchResult
}
